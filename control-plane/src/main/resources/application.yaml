spring:
  application:
    name: aegisflow-core
  profiles:
    default: foundation

server:
  address: 127.0.0.1
  port: ${CORE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
