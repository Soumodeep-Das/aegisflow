# This application receives only its own database configuration.
spring:
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://127.0.0.1:5433/aegisflow_core}
    username: ${CORE_DB_RUNTIME_USER:aegisflow_core_runtime}
    password: ${CORE_DB_RUNTIME_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    user: ${CORE_DB_MIGRATION_USER:aegisflow_core_migrator}
    password: ${CORE_DB_MIGRATION_PASSWORD}
    schemas: aegisflow
    default-schema: aegisflow
    create-schemas: false
    locations: classpath:db/migration
    fail-on-missing-locations: true
    clean-disabled: true
    placeholders:
      runtimeRole: ${CORE_DB_RUNTIME_USER:aegisflow_core_runtime}
