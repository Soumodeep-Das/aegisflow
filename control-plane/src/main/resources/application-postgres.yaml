# This application receives only its own database configuration.
aegisflow:
  core:
    projection:
      enabled: ${CORE_PROJECTION_ENABLED:false}
      configuration-version: ${CORE_PROJECTION_CONFIG_VERSION:demo-v1}
      inventory-seconds: ${CORE_INVENTORY_DURATION_SECONDS:45}
      lateness-seconds: ${CORE_EVENT_LATENESS_SECONDS:15}
      batch-size: ${CORE_PROJECTION_BATCH_SIZE:25}
    inbox:
      enabled: ${CORE_INBOX_ENABLED:false}
      bootstrap-servers: ${CORE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
      password: ${KAFKA_CORE_PASSWORD:}
      group: ${CORE_INBOX_GROUP:aegisflow-core-inbox-v1}
      channel: ${CORE_INBOX_CHANNEL:local-kafka-v1}
      order-tenants: ${CORE_INBOX_ORDER_TENANTS:}
      payment-tenants: ${CORE_INBOX_PAYMENT_TENANTS:}
      warehouse-tenants: ${CORE_INBOX_WAREHOUSE_TENANTS:}
spring:
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://127.0.0.1:5433/aegisflow_core}
    username: ${CORE_DB_RUNTIME_USER:aegisflow_core_runtime}
    password: ${CORE_DB_RUNTIME_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    user: ${CORE_DB_MIGRATION_USER:aegisflow_core_migrator}
    password: ${CORE_DB_MIGRATION_PASSWORD}
    schemas: aegisflow
    default-schema: aegisflow
    create-schemas: false
    locations: classpath:db/migration
    fail-on-missing-locations: true
    clean-disabled: true
    placeholders:
      runtimeRole: ${CORE_DB_RUNTIME_USER:aegisflow_core_runtime}
