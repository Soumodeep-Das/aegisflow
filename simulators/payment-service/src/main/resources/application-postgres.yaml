# This application receives only its own database configuration.
spring:
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://127.0.0.1:5435/aegisflow_payment}
    username: ${PAYMENT_DB_USER:aegisflow_payment}
    password: ${PAYMENT_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: false
