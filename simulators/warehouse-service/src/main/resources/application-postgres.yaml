# This application receives only its own database configuration.
spring:
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://127.0.0.1:5436/aegisflow_warehouse}
    username: ${WAREHOUSE_DB_USER:aegisflow_warehouse}
    password: ${WAREHOUSE_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: false
