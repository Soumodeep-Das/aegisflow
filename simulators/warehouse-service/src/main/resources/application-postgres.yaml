# This application receives only its own database configuration.
# Relay is opt-in; only this owner's Kafka credential and explicitly allowed tenants.
aegisflow:
  warehouse:
    relay:
      enabled: ${WAREHOUSE_OUTBOX_RELAY_ENABLED:false}
      bootstrap-servers: ${WAREHOUSE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
      password: ${KAFKA_WAREHOUSE_PASSWORD:}
      allowed-tenants: ${WAREHOUSE_OUTBOX_ALLOWED_TENANTS:}
      max-per-poll: ${WAREHOUSE_OUTBOX_MAX_PER_POLL:10}
spring:
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://127.0.0.1:5436/aegisflow_warehouse}
    username: ${WAREHOUSE_DB_RUNTIME_USER:aegisflow_warehouse_runtime}
    password: ${WAREHOUSE_DB_RUNTIME_PASSWORD}
  flyway:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://127.0.0.1:5436/aegisflow_warehouse}
    user: ${WAREHOUSE_DB_MIGRATION_USER:aegisflow_warehouse_migrator}
    password: ${WAREHOUSE_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: aegisflow
    schemas: aegisflow
    create-schemas: false
    fail-on-missing-locations: true
    placeholders:
      runtimeRole: ${WAREHOUSE_DB_RUNTIME_USER:aegisflow_warehouse_runtime}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: aegisflow
        jdbc:
          time_zone: UTC
