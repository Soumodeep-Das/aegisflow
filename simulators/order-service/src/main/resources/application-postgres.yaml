# This application receives only its own database configuration.
# Explicit opt-in; foundation/plain postgres need no Kafka credentials and never start a producer.
aegisflow:
  order:
    relay:
      enabled: ${ORDER_OUTBOX_RELAY_ENABLED:false}
      bootstrap-servers: ${ORDER_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
      password: ${KAFKA_ORDER_PASSWORD:}
      allowed-tenants: ${ORDER_OUTBOX_ALLOWED_TENANTS:}
      max-per-poll: ${ORDER_OUTBOX_MAX_PER_POLL:10}
spring:
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://127.0.0.1:5434/aegisflow_order}
    username: ${ORDER_DB_RUNTIME_USER:aegisflow_order_runtime}
    password: ${ORDER_DB_RUNTIME_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    user: ${ORDER_DB_MIGRATION_USER:aegisflow_order_migrator}
    password: ${ORDER_DB_MIGRATION_PASSWORD}
    schemas: aegisflow
    default-schema: aegisflow
    create-schemas: false
    locations: classpath:db/migration
    fail-on-missing-locations: true
    clean-disabled: true
    placeholders:
      runtimeRole: ${ORDER_DB_RUNTIME_USER:aegisflow_order_runtime}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: aegisflow
